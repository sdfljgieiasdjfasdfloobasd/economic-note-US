name: Publish prepared economic dashboard
on:
  push:
    branches: [main]
  schedule:
    # UTC 19:00 on the previous day = 04:00 Japan time, year-round.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: '公式データを取得してから公開（falseは保存済みデータの再公開のみ）'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public data parsers
        run: python -m pip install -r cloud/requirements.txt
      - name: Test update safety and publication scope
        run: |
          python tests/cloud.py
          python tests/publication.py
          python tools/verify.py
      - name: Refresh official data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python cloud/refresh.py
      - name: Verify complete public artifact
        run: python tools/verify.py
      - name: Save refreshed snapshot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site build-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public economic data (daily 04:00 JST)'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN commits do not trigger another push workflow; deploy here.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
